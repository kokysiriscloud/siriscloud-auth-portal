<main class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <section class="w-full max-w-md bg-white rounded-2xl shadow p-6 space-y-4">
    <h1 class="text-2xl font-semibold text-slate-800">Aceptar invitación de propietario</h1>
    <p class="text-sm text-slate-500">Dominio: <strong>{{ domain }}</strong></p>

    <form class="space-y-3" [formGroup]="form" (ngSubmit)="submit()">
      <label class="block">
        <span class="text-sm text-slate-700">Nombre completo</span>
        <input class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" formControlName="fullName" />
      </label>

      <label class="block">
        <span class="text-sm text-slate-700">Contraseña</span>
        <div class="relative mt-1">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 pr-11"
            formControlName="password"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="absolute inset-y-0 right-0 inline-flex items-center justify-center px-3 text-slate-500 hover:text-slate-700 cursor-pointer"
            (click)="toggleShowPassword()"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.title]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (showPassword) {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a18.16 18.16 0 0 1-3.2 4.36M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M14.12 14.12A3 3 0 0 1 9.88 9.88"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M1 1l22 22"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            } @else {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M1.5 12s3.5-7 10.5-7 10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
                <path
                  d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
              </svg>
            }
          </button>
        </div>
      </label>

      <label class="block">
        <span class="text-sm text-slate-700">Confirmar contraseña</span>
        <div class="relative mt-1">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 pr-11"
            formControlName="confirmPassword"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="absolute inset-y-0 right-0 inline-flex items-center justify-center px-3 text-slate-500 hover:text-slate-700 cursor-pointer"
            (click)="toggleShowConfirmPassword()"
            [attr.aria-label]="showConfirmPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.title]="showConfirmPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (showConfirmPassword) {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a18.16 18.16 0 0 1-3.2 4.36M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M14.12 14.12A3 3 0 0 1 9.88 9.88"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M1 1l22 22"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            } @else {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M1.5 12s3.5-7 10.5-7 10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
                <path
                  d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
              </svg>
            }
          </button>
        </div>
      </label>

      <button
        type="submit"
        class="w-full rounded-lg bg-indigo-600 text-white py-2 font-medium disabled:opacity-60"
        [disabled]="loading || !token || showSuccessModal"
      >
        {{ loading ? 'Activando...' : 'Activar cuenta' }}
      </button>
    </form>

    @if (error) {
      <p class="text-sm text-red-600">{{ error }}</p>
    }

    <a routerLink="/login" class="text-sm text-indigo-600 hover:underline">Ir a login</a>
  </section>
</main>

@if (showSuccessModal) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="owner-invite-success-title"
  >
    <div class="absolute inset-0 bg-slate-900/45 backdrop-blur-[2px]" aria-hidden="true"></div>

    <div
      class="relative w-full max-w-sm overflow-hidden rounded-2xl border border-white/60 bg-white shadow-2xl shadow-slate-900/20 animate-[fadeInUp_280ms_ease-out]"
    >
      <div class="absolute inset-x-0 top-0 h-1.5 bg-gradient-to-r from-indigo-500 via-violet-500 to-sky-400"></div>

      <div class="px-6 pb-6 pt-8 text-center">
        <div
          class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-emerald-50 text-emerald-600 ring-8 ring-emerald-50/70"
          aria-hidden="true"
        >
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path
              d="M20 6 9 17l-5-5"
              stroke="currentColor"
              stroke-width="2.25"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <h2 id="owner-invite-success-title" class="text-xl font-semibold tracking-tight text-slate-900">
          Cuenta activada
        </h2>
        <p class="mt-2 text-sm leading-relaxed text-slate-600">
          Cuenta activada correctamente. Ya puedes iniciar sesión.
        </p>

        <button
          type="button"
          class="mt-6 w-full rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-500"
          (click)="goToLogin()"
        >
          Ir a ingresar
        </button>

        <p class="mt-3 text-xs text-slate-400">Te redirigimos automáticamente en {{ redirectSeconds }}s…</p>
      </div>
    </div>
  </div>
}
